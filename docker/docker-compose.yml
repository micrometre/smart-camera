services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smart-camera-app
    environment:
      - NODE_ENV=production
      - PORT=3000
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../public:/app/public
      - ../detections.json:/app/detections.json
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: smart-camera-nginx
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx:rw
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../public:/app/public:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
